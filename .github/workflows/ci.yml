name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r backend/requirements.txt
      - name: Import smoke test
        run: |
          PYTHONPATH=. python -c "
          import backend.graph.graph
          import backend.mcp_server.server
          import backend.rag.embeddings
          import backend.graph.guardrails
          import backend.graph.cache
          print('all key modules import cleanly')
          "

  evals:
    # Golden-dataset accuracy + LLM-as-judge run on every PR (ТЗ 2.3). Only needs
    # OPENAI_API_KEY — the dataset is fully synthetic (backend/evals/golden_dataset.py),
    # so this doesn't touch the GitHub API or need Qdrant running.
    runs-on: ubuntu-latest
    needs: smoke-test
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r backend/requirements.txt
      - name: Run golden-dataset evals
        run: PYTHONPATH=. python -m backend.evals.run_evals
      - name: Upload eval results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: backend/evals/results.json
